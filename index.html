<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sức Khỏe Sinh Viên - HPU2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        h2 {
            color: #2980b9;
            margin-top: 30px;
            border-left: 4px solid #2980b9;
            padding-left: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f8f5;
            border: 1px solid #1abc9c;
            border-radius: 5px;
            display: none;
            line-height: 1.6;
        }
        .section-card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HỆ THỐNG QUẢN LÝ SỨC KHỎE SINH VIÊN - HPU2</h1>

    <!-- Phân hệ 1: Đánh giá thể lực -->
    <div class="section-card">
        <h2>1. Đánh giá Thể lực (Theo tiêu chuẩn Bộ Y Tế)</h2>
        <div class="form-group">
            <label>Giới tính:</label>
            <select id="tl_gioitinh">
                <option value="1">Nam</option>
                <option value="2">Nữ</option>
            </select>
        </div>
        <div class="form-group">
            <label>Chiều cao (cm):</label>
            <input type="number" id="tl_chieucao" placeholder="Ví dụ: 165">
        </div>
        <div class="form-group">
            <label>Cân nặng (kg):</label>
            <input type="number" id="tl_cannang" placeholder="Ví dụ: 55">
        </div>
        <button onclick="danhGiaTheLuc()">Đánh Giá Thể Lực</button>
        <div id="kq_theluc" class="result-box"></div>
    </div>

    <!-- Phân hệ 2: Vận động -->
    <div class="section-card">
        <h2>2. Đánh giá Vận động (Theo WHO)</h2>
        <div class="form-group">
            <label>Số bước chân trung bình/ngày:</label>
            <input type="number" id="vd_buoc" placeholder="Ví dụ: 8000">
        </div>
        <div class="form-group">
            <label>Số phút tập mức độ VỪA mỗi tuần (đi bộ, đạp xe...):</label>
            <input type="number" id="vd_vua" placeholder="Ví dụ: 150">
        </div>
        <div class="form-group">
            <label>Số phút tập mức độ MẠNH mỗi tuần (chạy bộ, đá bóng...):</label>
            <input type="number" id="vd_manh" placeholder="Ví dụ: 30">
        </div>
        <div class="form-group">
            <label>Số ngày tập cơ bắp mỗi tuần (hít đất, gym...):</label>
            <input type="number" id="vd_co" placeholder="Ví dụ: 2">
        </div>
        <button onclick="danhGiaVanDong()">Đánh Giá Vận Động</button>
        <div id="kq_vandong" class="result-box"></div>
    </div>

    <!-- Phân hệ 3: Nước uống -->
    <div class="section-card">
        <h2>3. Đánh giá Lượng nước uống</h2>
        <div class="form-group">
            <label>Cân nặng của bạn (kg):</label>
            <input type="number" id="nc_cannang" placeholder="Ví dụ: 50">
        </div>
        <div class="form-group">
            <label>Thời gian tập thể thao mỗi ngày (phút):</label>
            <input type="number" id="nc_thethao" placeholder="Ví dụ: 45">
        </div>
        <div class="form-group">
            <label>Lượng nước bạn uống mỗi ngày (Lít):</label>
            <input type="number" step="0.1" id="nc_uong" placeholder="Ví dụ: 1.5">
        </div>
        <button onclick="danhGiaNuoc()">Đánh Giá Nước Uống</button>
        <div id="kq_nuoc" class="result-box"></div>
    </div>

    <!-- Phân hệ 4: Giấc ngủ -->
    <div class="section-card">
        <h2>4. Đánh giá Giấc ngủ</h2>
        <div class="form-group">
            <label>Thời lượng ngủ mỗi đêm (Tiếng):</label>
            <input type="number" step="0.5" id="ng_gio" placeholder="Ví dụ: 7.5">
        </div>
        <div class="form-group">
            <label>Giờ bắt đầu ngủ (0-23):</label>
            <input type="number" id="ng_bedtime" placeholder="Ví dụ: 23">
        </div>
        <div class="form-group">
            <label>Thời gian để chìm vào giấc ngủ (Phút):</label>
            <input type="number" id="ng_chim" placeholder="Ví dụ: 15">
        </div>
        <div class="form-group">
            <label>Thời gian ngủ trưa (Phút - Nhập 0 nếu không ngủ):</label>
            <input type="number" id="ng_trua" placeholder="Ví dụ: 20">
        </div>
        <button onclick="danhGiaGiacNgu()">Đánh Giá Giấc Ngủ</button>
        <div id="kq_ngu" class="result-box"></div>
    </div>
</div>

<script>
    // Logic Đánh giá Thể Lực
    function danhGiaTheLuc() {
        let gioiTinh = parseInt(document.getElementById('tl_gioitinh').value);
        let chieuCao = parseFloat(document.getElementById('tl_chieucao').value);
        let canNang = parseFloat(document.getElementById('tl_cannang').value);
        let divKq = document.getElementById('kq_theluc');

        if (isNaN(chieuCao) || isNaN(canNang) || chieuCao <= 0 || canNang <= 0) {
            divKq.innerHTML = "<b style='color:red;'>Vui lòng nhập số liệu hợp lệ!</b>";
            divKq.style.display = "block";
            return;
        }

        let loaiChieuCao = 5, loaiCanNang = 5;

        if (gioiTinh === 1) { // Nam
            if (chieuCao >= 160) loaiChieuCao = 1;
            else if (chieuCao >= 156) loaiChieuCao = 2;
            else if (chieuCao >= 152) loaiChieuCao = 3;
            else if (chieuCao >= 149) loaiChieuCao = 4;
            
            if (canNang >= 48) loaiCanNang = 1;
            else if (canNang >= 46) loaiCanNang = 2;
            else if (canNang >= 42) loaiCanNang = 3;
            else if (canNang >= 39) loaiCanNang = 4;
        } else { // Nữ
            if (chieuCao >= 152) loaiChieuCao = 1;
            else if (chieuCao >= 149) loaiChieuCao = 2;
            else if (chieuCao >= 145) loaiChieuCao = 3;
            else if (chieuCao >= 142) loaiChieuCao = 4;
            
            if (canNang >= 44) loaiCanNang = 1;
            else if (canNang >= 42) loaiCanNang = 2;
            else if (canNang >= 40) loaiCanNang = 3;
            else if (canNang >= 37) loaiCanNang = 4;
        }

        let loaiTheLuc = Math.max(loaiChieuCao, loaiCanNang);
        let ketQua = ["I (Rất khỏe)", "II (Khỏe)", "III (Trung bình)", "IV (Yếu)", "V (Rất yếu)"];

        divKq.innerHTML = `<b>=> KẾT QUẢ PHÂN LOẠI THỂ LỰC: LOẠI ${ketQua[loaiTheLuc - 1]}</b><br>
                           <i>(Chi tiết: Chiều cao đạt Loại ${loaiChieuCao} | Cân nặng đạt Loại ${loaiCanNang})</i>`;
        divKq.style.display = "block";
    }

    // Logic Đánh giá Vận Động
    function danhGiaVanDong() {
        let buoc = parseInt(document.getElementById('vd_buoc').value) || 0;
        let p_vua = parseInt(document.getElementById('vd_vua').value) || 0;
        let p_manh = parseInt(document.getElementById('vd_manh').value) || 0;
        let ngay_co = parseInt(document.getElementById('vd_co').value) || 0;
        let divKq = document.getElementById('kq_vandong');
        let html = "<b>=> KẾT QUẢ ĐÁNH GIÁ VẬN ĐỘNG:</b><br><ul>";

        if (buoc >= 7000 && buoc <= 10000) html += "<li><b>Số bước chân:</b> Đạt chuẩn (Giảm tác hại ngồi nhiều).</li>";
        else if (buoc > 10000) html += "<li><b>Số bước chân:</b> Rất tốt, bạn rất năng động!</li>";
        else html += "<li><b>Số bước chân:</b> Chưa đạt (Mục tiêu: 7000 - 10000 bước/ngày).</li>";

        if (p_vua >= 150 || p_manh >= 75) html += "<li><b>Thời lượng vận động:</b> Đạt tiêu chuẩn của WHO.</li>";
        else html += "<li><b>Thời lượng vận động:</b> Thiếu (Cần 150p vừa hoặc 75p mạnh mỗi Tuần).</li>";

        if (ngay_co >= 2) html += "<li><b>Tập cơ bắp:</b> Đạt chuẩn (>= 2 ngày/tuần).</li>";
        else html += "<li><b>Tập cơ bắp:</b> Nên bổ sung các bài tập cơ bắp ít nhất 2 ngày/tuần.</li>";

        html += "</ul><i>*Lời khuyên: Hạn chế ngồi liên tục quá lâu, hãy đứng dậy vươn vai sau mỗi 45-60 phút.</i>";
        divKq.innerHTML = html;
        divKq.style.display = "block";
    }

    // Logic Đánh giá Nước
    function danhGiaNuoc() {
        let canNang = parseFloat(document.getElementById('nc_cannang').value);
        let theThao = parseFloat(document.getElementById('nc_thethao').value) || 0;
        let uong = parseFloat(document.getElementById('nc_uong').value);
        let divKq = document.getElementById('kq_nuoc');

        if (isNaN(canNang) || isNaN(uong) || canNang <= 0 || uong < 0) {
            divKq.innerHTML = "<b style='color:red;'>Vui lòng nhập số liệu hợp lệ!</b>";
            divKq.style.display = "block";
            return;
        }

        let nuocCoBan = canNang * 0.035; 
        let nuocBoSung = (theThao / 30.0) * 0.4;
        let tongNuocCan = nuocCoBan + nuocBoSung;

        let html = `<b>=> Lượng nước cơ thể bạn cần mỗi ngày: Khoảng ${tongNuocCan.toFixed(2)} lít.</b><br>`;
        if (uong >= tongNuocCan) {
            html += "<b>=> Đánh giá:</b> Bạn đã uống đủ lượng nước cần thiết! Tuyệt vời!<br>";
        } else {
            html += `<b>=> Đánh giá:</b> Bạn đang uống thiếu khoảng ${(tongNuocCan - uong).toFixed(2)} lít nước.<br>`;
        }
        html += "<i>*Dấu hiệu đủ nước: Nước tiểu có màu vàng nhạt/trong suốt, đi tiểu 5-7 lần/ngày.</i>";

        divKq.innerHTML = html;
        divKq.style.display = "block";
    }
